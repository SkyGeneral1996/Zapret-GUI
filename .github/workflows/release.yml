name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: python -m PyInstaller ZapretGUI.spec --noconfirm

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import version; print(version.APP_VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer\ZapretGUI.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ZapretGUI.exe
            dist/ZapretGUI-Setup.exe
          generate_release_notes: true